<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cybersecurity Study Resources</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <h1>Cybersecurity Study Resources</h1>
    <p class="intro">Save and organize your cybersecurity learning resources in one place.</p>

  <form class="add" action="/add" method="post">
    <input name="topic" placeholder="Topic" required>
    <input name="material" placeholder="Material" required>
    <input type="url" name="url" placeholder="https://example.com" required>
    <button type="submit">Add Resource</button>
  </form>

    {% if entries %}
    <table>
      <thead>
        <tr><th>Topic</th><th>Material</th><th>Resource URL</th></tr>
      </thead>
      <tbody>
        {% for entry in entries %}
        <tr>
          <td>{{ entry.topic }}</td>
          <td>{{ entry.material }}</td>
          <td>    
            <a href="{{ entry.url }}" target="_blank" rel="noopener noreferrer">
              Open Resource
            </a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p class="empty">No study resources added yet.</p>
    {% endif %}
  </main>
</body>
</html>
